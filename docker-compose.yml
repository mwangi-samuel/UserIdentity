services:
  db:
    image: mysql:8.4.0
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      # TCP, not the socket, so the temporary server during first-run init doesn't count as ready
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda:
    image: redpandadata/redpanda:v25.3.3
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - 9092:9092
      - 8081:8081
    command:
      - redpanda
      - start
      - --mode=dev-container
      # One shard: each shard reserves Linux AIO slots, and one per core exhausts fs.aio-max-nr so MySQL cannot start
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:19092,external://localhost:9092
      - --schema-registry-addr=internal://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: redpandadata/console:v3.3.2
    ports:
      - 8090:8080
    environment:
      KAFKA_BROKERS: redpanda:19092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy

  useridentity:
    build:
      context: .
      dockerfile: UserIdentity/Dockerfile
    ports:
      - 5050:8080
    environment:
      MysqlSettings__Host: db
      KafkaSettings__BootstrapServers: redpanda:19092
      KafkaSettings__SchemaRegistryUrl: redpanda:8081
      KeySetOptions__PrivateKeyPassPhrase: ${EDDSA_PRIVATE_KEY_PASSPHRASE:-S3T@G00dPa22Phr@S3}
      EDDSA_PRIVATE_KEY:
      EDDSA_PUBLIC_KEY:
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure:5

volumes:
  mysql_data:
  redpanda_data:
