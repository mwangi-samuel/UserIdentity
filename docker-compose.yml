services:
  db:
    image: postgres:18.7
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.15.2-alpine
    volumes:
      - nats_data:/data
    ports:
      - 4222:4222
      - 8222:8222
    configs:
      - source: nats_config
        target: /etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 30

  nats-ui:
    image: ghcr.io/nats-nui/nui:0.10.0
    command: --nats-cli-contexts=/nats-cli-contexts
    volumes:
      - nats_ui_data:/db
    ports:
      - 31311:31311
    configs:
      - source: nats_ui_context
        target: /nats-cli-contexts/local.json
    depends_on:
      nats:
        condition: service_healthy

  code-service:
    image: mockserver/mockserver:9.2.0
    ports:
      - 1080:1080
    environment:
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/code-service.json
    configs:
      - source: code_service_expectations
        target: /config/code-service.json

  lgtm:
    image: grafana/otel-lgtm:0.38.1
    volumes:
      - lgtm_data:/data
    ports:
      - 3030:3000
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2G

  useridentity:
    build:
      context: .
      dockerfile: UserIdentity/Dockerfile
    ports:
      - 5050:8080
    environment:
      DatabaseSettings__Host: db
      MessagingSettings__NatsUrl: nats://nats:4222
      CodeCheckSettings__VerifyUrl: http://code-service:1080/api/v1/message/verify
      CodeCheckSettings__ResendUrl: http://code-service:1080/api/v1/message/retry
      EDDSA_PRIVATE_KEY:
      EDDSA_PUBLIC_KEY:
      RateLimitSettings__PermitLimit: 5
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Information              
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information    
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Information
      Logging__LogLevel__System.Net.Http.HttpClient: Information
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic MDAwMDAwOkdyYWZhbmEtVG9rZW4tRm9yLUxvY2FsLVVzZS1Pbmx5
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      code-service:
        condition: service_started
      lgtm:
        condition: service_healthy
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

volumes:
  postgres_data:
  nats_data:
  nats_ui_data:
  lgtm_data:

configs:
  nats_ui_context:
    content: |
      {
        "url": "nats://nats:4222",
        "user": "ui",
        "password": "ui-local"
      }

  nats_config:
    content: |
      port: 4222
      http_port: 8222

      jetstream {
        store_dir: /data
        # A single server must sync every write, or a crash loses messages it has already acknowledged
        sync_interval: always
      }

      authorization {
        users: [
          {
            user: useridentity, password: useridentity-local,
            permissions: {
              publish: ["useridentity.>", "$$JS.API.STREAM.UPDATE.USERIDENTITY", "$$JS.API.STREAM.CREATE.USERIDENTITY"]
              subscribe: ["_INBOX_useridentity.>"]
            }
          },
          { user: ui, password: ui-local }
        ]
      }

  code_service_expectations:
    content: |
      [
        {
          "priority": 1,
          "httpRequest": {
            "method": "POST",
            "path": "/api/v1/message/verify",
            "body": { "type": "JSON", "json": { "code": "123456" } }
          },
          "httpResponse": {
            "statusCode": 200,
            "headers": { "Content-Type": ["application/json"] },
            "body": { "outcome": "Verified" }
          }
        },
        {
          "httpRequest": { "method": "POST", "path": "/api/v1/message/verify" },
          "httpResponse": {
            "statusCode": 200,
            "headers": { "Content-Type": ["application/json"] },
            "body": { "outcome": "WrongCode" }
          }
        },
        {
          "httpRequest": { "method": "POST", "path": "/api/v1/message/retry" },
          "httpResponse": {
            "statusCode": 200,
            "headers": { "Content-Type": ["application/json"] },
            "body": { "outcome": "Sent" }
          }
        }
      ]
