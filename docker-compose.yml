services:
  db:
    image: mysql:8.4.0
    container_name: db
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: useridentity
      MYSQL_USER: test_user
      MYSQL_PASSWORD: tesT*_p@ss12
    networks:
      - services_network

  redpanda:
    image: redpandadata/redpanda:v25.3.3
    container_name: redpanda
    ports:
      - "9092:9092"
      - "8081:8081"
    volumes:
      - ./mounts/redpanda-0:/var/lib/redpanda/data
    networks:
      - services_network
    command:
      - redpanda
      - start
      - --mode=dev-container
      # One shard: each shard reserves Linux AIO slots, and one per core exhausts fs.aio-max-nr so MySQL cannot start
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:19092,external://localhost:9092
      - --schema-registry-addr=internal://0.0.0.0:8081

  redpanda-console:
    image: redpandadata/console:v3.3.2
    container_name: redpanda-console
    ports:
      - "8090:8080"
    networks:
      - services_network
    environment:
      KAFKA_BROKERS: redpanda:19092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      - redpanda

  useridentity:
    image: useridentity
    build:
      context: .
      dockerfile: UserIdentity/Dockerfile
    container_name: useridentity
    ports:
      - 5050:8080
    environment:
      MysqlSettings__Host: db
      MysqlSettings__Port: 3306
      MysqlSettings__Database: useridentity
      MysqlSettings__UserName: test_user
      MysqlSettings__Password: tesT*_p@ss12
      KafkaSettings__BootstrapServers: redpanda:19092
      KafkaSettings__SchemaRegistryUrl: redpanda:8081
      JwtIssuerOptions__ValidForSeconds: 600
      KeySetOptions__PrivateKeyPassPhrase: ${EDDSA_PRIVATE_KEY_PASSPHRASE:-S3T@G00dPa22Phr@S3} 
      EDDSA_PRIVATE_KEY: # Ensure to set this environment variable with your actual EDDSA private key
      EDDSA_PUBLIC_KEY: # Ensure to set this environment variable with your actual EDDSA public key
      AppSecretOptions__CurrentKeyId: key1
      AppSecretOptions__Keys__key1: 92rZ4zje0cty5rhoYf+CjjLoqYy575oHjy76A4RUEPo=
      ApiKeySettings__ApiKey: yM1nXap7fnwRv8QFbvsMovCDjb33Y862
      Serilog__MinimumLevel: Warning
    depends_on:
      - db
      - redpanda
    restart: on-failure:5
    networks:
      - services_network

networks:
  services_network:
    name: app_services_network
    driver: bridge
