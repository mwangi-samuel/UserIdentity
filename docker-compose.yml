services:
  db:
    image: mysql:9.7.4
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      # TCP, not the socket, so the temporary server during first-run init doesn't count as ready
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2.15.2-alpine
    volumes:
      - nats_data:/data
    ports:
      - 4222:4222
      - 8222:8222
    configs:
      - source: nats_config
        target: /etc/nats/nats-server.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 30

  nats-ui:
    image: ghcr.io/nats-nui/nui:0.10.0
    command: --nats-cli-contexts=/nats-cli-contexts
    volumes:
      - nats_ui_data:/db
    ports:
      - 31311:31311
    configs:
      - source: nats_ui_context
        target: /nats-cli-contexts/local.json
    depends_on:
      nats:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.38.1
    volumes:
      - lgtm_data:/data
    ports:
      - 3030:3000
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2G

  useridentity:
    build:
      context: .
      dockerfile: UserIdentity/Dockerfile
    ports:
      - 5050:8080
    environment:
      DatabaseSettings__Host: db
      MessagingSettings__NatsUrl: nats://nats:4222
      EDDSA_PRIVATE_KEY:
      EDDSA_PUBLIC_KEY:
      BootstrapAdminSettings__AppName:
      BootstrapAdminSettings__AppBaseUrl:
      BootstrapAdminSettings__UserName:
      BootstrapAdminSettings__FirstName:
      BootstrapAdminSettings__Email:
      BootstrapAdminSettings__Password:
      RateLimitSettings__PermitLimit: 5
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Information
      Logging__LogLevel__Microsoft.AspNetCore: Information              
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information    
      Logging__LogLevel__Microsoft.AspNetCore.DataProtection: Information
      Logging__LogLevel__System.Net.Http.HttpClient: Information
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Basic MDAwMDAwOkdyYWZhbmEtVG9rZW4tRm9yLUxvY2FsLVVzZS1Pbmx5
    depends_on:
      db:
        condition: service_healthy
      nats:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

volumes:
  mysql_data:
  nats_data:
  nats_ui_data:
  lgtm_data:

configs:
  nats_ui_context:
    content: |
      {
        "url": "nats://nats:4222",
        "user": "ui",
        "password": "ui-local"
      }

  nats_config:
    content: |
      port: 4222
      http_port: 8222

      jetstream {
        store_dir: /data
        # A single server must sync every write, or a crash loses messages it has already acknowledged
        sync_interval: always
      }

      authorization {
        users: [
          { user: useridentity, password: useridentity-local, permissions: { publish: ["useridentity.>", "$$JS.API.>", "$$JS.ACK.>"], subscribe: ["_INBOX.>"] } },
          { user: ui, password: ui-local }
        ]
      }
