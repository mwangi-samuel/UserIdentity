name: Build Tests

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]

jobs:
  build-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test --project ./UserIdentity.UnitTests/UserIdentity.UnitTests.csproj --configuration Release --no-build

      - name: Integration Tests
        run: dotnet test --project ./UserIdentity.IntegrationTests/UserIdentity.IntegrationTests.csproj --configuration Release --no-build
