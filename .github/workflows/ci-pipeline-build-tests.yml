name: Build Tests

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize]

jobs:
  build-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit Tests
        run: dotnet test --project ./UserIdentity.UnitTests/UserIdentity.UnitTests.csproj --no-build --coverlet

      - name: Integration Tests
        run: dotnet test --project ./UserIdentity.IntegrationTests/UserIdentity.IntegrationTests.csproj --no-build --coverlet
