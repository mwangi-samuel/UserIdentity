name: Publish Docker Image

permissions:
  contents: read

on:
  release:
    types: [published]

jobs:
  push-to-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./UserIdentity/Dockerfile
          load: true
          tags: useridentity:smoke

      - name: Smoke Tests
        run: dotnet test --project ./UserIdentity.SmokeTests/UserIdentity.SmokeTests.csproj
        env:
          USERIDENTITY_SMOKE_IMAGE: useridentity:smoke

      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/useridentity
          tags: type=semver,pattern={{version}}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./UserIdentity/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
